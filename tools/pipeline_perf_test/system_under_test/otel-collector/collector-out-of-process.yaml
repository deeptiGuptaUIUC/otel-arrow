apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  collector-config.yaml: |
    receivers:
      otlp/loadgen:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      otlp/from-child:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4318

    exporters:
      debug:
        verbosity: detailed
      otlp/child-collector:
        endpoint: second-collector-service:6317
        tls:
          insecure: true
      otlp/backend:
        endpoint: backend-service:5317
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp/loadgen]
          exporters: [otlp/child-collector]
        logs/from-second:
          receivers: [otlp/from-child]
          exporters: [otlp/backend]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: second-collector-config
data:
  second-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:6317

    processors:
      batch:

    exporters:
      otlp:
        endpoint: otel-collector-service:4318
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector:latest
        args:
        - "--config=/etc/otel/collector-config.yaml"
        resources:
          requests:
            cpu: 500m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: from-child
        volumeMounts:
        - name: collector-config
          mountPath: /etc/otel
      volumes:
      - name: collector-config
        configMap:
          name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: from-child
    port: 4318
    targetPort: 4318

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-collector
  labels:
    app: second-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-collector
  template:
    metadata:
      labels:
        app: second-collector
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector:latest
        args:
        - "--config=/etc/otel/second-collector-config.yaml"
        resources:
          requests:
            cpu: 500m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 6317
          name: otlp-grpc
        volumeMounts:
        - name: second-collector-config
          mountPath: /etc/otel
      volumes:
      - name: second-collector-config
        configMap:
          name: second-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: second-collector-service
spec:
  selector:
    app: second-collector
  ports:
  - name: otlp-grpc
    port: 6317
    targetPort: 6317